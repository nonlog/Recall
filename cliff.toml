# git-cliff configuration: turns the conventional-commit history into
# CHANGELOG.md. `make release-*` runs it through cargo-release's pre-release
# hook, so the changelog is part of the release commit and of the tag itself.

[changelog]
header = """
# Changelog

Generated from conventional commits by [git-cliff](https://git-cliff.org).
Do not edit this file by hand; edit the commit messages instead.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/samzong/Recall/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true

commit_preprocessors = [
  # `(#118)` is the squash-merge suffix GitHub adds; make it a link.
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/samzong/Recall/pull/${1}))" },
]

commit_parsers = [
  # Release bumps and merge commits are noise in a release note.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  # Breaking changes lead, whatever type they were declared under.
  { message = "^[a-z]+(\\(.+\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { body = "BREAKING CHANGE", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^ci|^build", group = "<!-- 7 -->Chores" },
]

filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
