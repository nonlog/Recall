name: Sync Upstream Release

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: samzong/Recall

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve latest upstream release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::unexpected upstream release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already present in this fork"
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch upstream release without importing its tag
        if: steps.upstream.outputs.already_synced != 'true'
        shell: bash
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "refs/tags/$TAG:refs/remotes/upstream-release/$TAG"

      - name: Merge upstream release into customized main
        if: steps.upstream.outputs.already_synced != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          upstream_ref="refs/remotes/upstream-release/$TAG"
          if ! git merge --no-edit "$upstream_ref"; then
            git merge --abort || true
            title="Upstream sync conflict: $TAG"
            body="Automated merge of samzong/Recall $TAG into this customized fork failed. The fork main branch was left unchanged; resolve the conflict manually and keep the session-delete feature intact."
            if ! gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
            exit 1
          fi

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::upstream tag $TAG does not match merged Cargo.toml version ${version:-missing}"
            exit 1
          fi

          # Fail closed if a future upstream merge removes the custom delete CLI or TUI.
          grep -q 'SessionCommands::Delete' src/session.rs
          grep -q 'mod session_delete' src/lib.rs
          test -f src/session_delete.rs
          grep -q 'mod delete_state' src/tui/mod.rs
          grep -q 'AppMode::ConfirmDelete' src/tui/app.rs
          grep -q 'Del.*delete' src/tui/ui/popups.rs
          test -f src/tui/delete_state.rs

      - uses: dtolnay/rust-toolchain@stable
        if: steps.upstream.outputs.already_synced != 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.upstream.outputs.already_synced != 'true'

      - name: Install audit tool
        if: steps.upstream.outputs.already_synced != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - uses: actions/cache@v5
        if: steps.upstream.outputs.already_synced != 'true'
        with:
          path: ~/.cache/ort.pyke.io
          key: ort-${{ hashFiles('Cargo.lock') }}

      - name: Validate merged fork
        if: steps.upstream.outputs.already_synced != 'true'
        shell: bash
        run: |
          set -euo pipefail
          make check
          help="$(cargo run --quiet -- session delete --help)"
          grep -Fq -- '--dry-run' <<<"$help"
          grep -Fq -- '--permanent' <<<"$help"
          grep -Fq -- '--index-only' <<<"$help"

      - name: Publish customized main and matching release tag
        if: steps.upstream.outputs.already_synced != 'true'
        shell: bash
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Ensure fork binary release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG release already exists in $GITHUB_REPOSITORY"
            exit 0
          fi

          # gh can otherwise resolve a fork checkout back to the upstream repository.
          # Pin the dispatch target explicitly and make this step idempotent so a later
          # sync can recover when the tag exists but a previous release dispatch failed.
          echo "Dispatching release.yml for $TAG in $GITHUB_REPOSITORY"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main -f "tag=$TAG"
